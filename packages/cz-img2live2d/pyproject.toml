[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cz-img2live2d"
version = "0.1.0"
description = "Agent toolkit combining Changzheng, PuppetLoom and Anime2.5DRig"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "numpy>=1.26", "pydantic>=2.6"]

[project.optional-dependencies]
review = ["playwright>=1.50"]

[project.scripts]
cz-img2live2d = "cz_img2live2d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cz_img2live2d = ["*.json", "*.cjs", "*.js", "*.html", "*.txt"]

[tool.setuptools.data-files]
"share/cz-img2live2d" = ["README.md", "THIRD_PARTY.md", "ACCEPTANCE.md"]
"share/cz-img2live2d/skills/cz-img2live2d" = ["skills/cz-img2live2d/SKILL.md"]
