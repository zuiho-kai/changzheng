<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小征 · 排练室</title>
<style>
:root{color-scheme:dark;font-family:'Segoe UI','Microsoft YaHei',sans-serif;color:#eeeade;background:#171b1b}*{box-sizing:border-box}body{margin:0}header{height:76px;display:flex;align-items:center;padding:0 28px;gap:20px;border-bottom:1px solid #394140}h1{font-size:23px;margin:0;letter-spacing:2px}header span{font:12px Consolas,monospace;color:#9bc5ab}.badge{margin-left:auto;border:1px solid #769380;border-radius:30px;padding:7px 12px;font-size:12px;color:#b7d6be}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;padding:24px;max-width:1800px;margin:auto}.preview{background:#0b0e0d;border:1px solid #343d3a;border-radius:10px;overflow:hidden}.screen{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden}iframe{width:1280px;height:720px;border:0;transform-origin:0 0;position:absolute;left:0;top:0}.previewbar{padding:13px 16px;display:flex;align-items:center;gap:12px;font-size:12px;color:#b3c1b8}.previewbar b{color:#c4e1c8;font-weight:500}button,input,select{font:inherit}button{border:1px solid #48544e;background:#29332d;color:#eeeade;border-radius:6px;padding:10px 12px;cursor:pointer;font-size:13px}button:hover{background:#3d5041;border-color:#a0b69d}button:disabled{opacity:.5;cursor:wait}.primary{background:#b9d7a2;color:#17241a;border-color:#b9d7a2;font-weight:600}.danger{background:#472f2a;border-color:#815249;color:#f6c5b7}.row{display:flex;gap:8px;flex-wrap:wrap}.controls{display:flex;flex-direction:column;gap:21px}h2{font-size:13px;font-weight:500;color:#b9c9bb;margin:0 0 10px}h2 small{font:10px Consolas;margin-right:8px;color:#698272}p{font-size:12px;color:#99a99f;line-height:1.7;margin:9px 0}input{min-width:0;width:100%;padding:10px 12px;color:#eeeade;background:#202724;border:1px solid #46544b;border-radius:6px;outline:none}input:focus{border-color:#b9d7a2}form{display:grid;gap:8px}.events{margin-top:18px;border-top:1px solid #39413b;padding-top:15px}#events{height:150px;overflow:auto;font-size:12px;line-height:1.9;color:#a4b3a8;font-family:Consolas,'Microsoft YaHei',monospace}.event{display:flex;gap:12px}.event time{color:#64796c}.event b{font-weight:400;color:#c2d4c3}#notice{min-height:20px;color:#e7c699;font-size:12px}a{color:#bfdaa8}#fps{margin-left:auto}footer{padding:8px 24px 20px;font-size:12px;color:#74877b}#record-result{display:block;font-size:12px;margin-top:9px}@media(max-width:1050px){.layout{grid-template-columns:1fr}.controls{display:grid;grid-template-columns:1fr 1fr}}@media(max-width:620px){header span{display:none}.controls{grid-template-columns:1fr}.layout{padding:12px}}
[hidden]{display:none!important}</style></head><body>
<header><h1>小征 · 排练室</h1><span>REHEARSAL / 01</span><div class="badge">本地模拟 · 独立于直播</div></header>
<main class="layout"><section><div class="preview"><div class="screen"><iframe id="stage" src="/stage?audio=1" allow="autoplay" title="模拟直播预览"></iframe></div><div class="previewbar"><b id="status">模型加载中</b><span id="audio">声音等待启用</span><span id="fps"></span><button id="reload">刷新排练版本</button></div></div>
<div class="events"><h2>排练记录</h2><div id="events" aria-live="polite"></div></div><p id="notice" role="status"></p></section>
<aside class="controls"><section><h2><small>01</small>完整场景</h2><div class="row"><button class="primary" id="scenario">▶ 30 秒自动排练</button><button class="danger" data-action="stop">■ 打断</button></div><p>待机 → 弹幕 → 思考 → 开口 → 中途打断 → 陪伴。嘴型跟随实际播放的声音。</p></section>
<section><h2><small>02</small>发一条模拟弹幕</h2><form id="chat"><input id="user" aria-label="模拟观众名" value="摸鱼观众"><input id="text" aria-label="弹幕内容" value="小征，你又在偷偷发呆？" maxlength="300" required><button type="submit">发送到排练画面 ↗</button></form><p>自由弹幕测试看向弹幕的动作；回应使用下方固定录音。</p></section>
<section><h2><small>03</small>动作与表情</h2><div class="row"><button data-action="state" data-value="idle">待机</button><button data-action="state" data-value="listening">倾听</button><button data-action="state" data-value="thinking">思考</button></div><div class="row" style="margin-top:8px"><button data-action="expression" data-value="happy">开心</button><button data-action="expression" data-value="curious">好奇</button><button data-action="expression" data-value="surprised">惊讶</button><button data-action="expression" data-value="serious">认真</button></div></section>
<section><h2><small>04</small>测试语音 · Diana</h2><div class="row"><button data-action="voice" data-value="curious">好奇追问</button><button data-action="voice" data-value="tease">调侃回应</button><button data-action="voice" data-value="comfort">安静陪伴</button></div><p>使用已有录音，不调用模型和语音服务。</p></section>
<section><h2><small>05</small>留样与重置</h2><div class="row"><button id="record">录制 30 秒动作</button><button data-action="reset">清空排练</button></div><a id="record-result" hidden download>下载录像</a><p>独立观察窗口录制，录像为静音画面。录制就绪后可操作以上按钮。</p></section></aside></main>
<footer>改动目录：simulator/workspace　·　刷新只加载排练副本　·　模拟器不会发布改动</footer>
<script>
const $=s=>document.querySelector(s), frame=$('#stage');
new ResizeObserver(()=>{frame.style.transform=`scale(${$('.screen').clientWidth/1280})`}).observe($('.screen'));
async function post(path,data={}){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.detail||'操作失败');return d}
function enable(){const avatar=frame.contentDocument?.querySelector('#avatar');avatar?.contentWindow.postMessage({type:'broadcast-enable-audio'},location.origin)}
async function act(action,value,extra={}){enable();try{await post('/sim/action',{action,value,...extra});$('#notice').textContent=''}catch(e){$('#notice').textContent=e.message}}
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action,b.dataset.value));
$('#chat').onsubmit=e=>{e.preventDefault();act('chat',null,{user:$('#user').value,text:$('#text').value})};
$('#scenario').onclick=()=>act('scenario');
$('#reload').onclick=async()=>{await act('stop');frame.contentWindow.location.reload()};
$('#record').onclick=async()=>{try{await post('/sim/record');$('#notice').textContent='正在准备录像窗口…'}catch(e){$('#notice').textContent=e.message}};
let eventVersion='';
async function poll(){try{const d=await(await fetch('/sim/status')).json();const names={idle:'自由待机',thinking:'正在思考',listening:'正在倾听',speaking:'正在说话'};$('#status').textContent=names[d.status];$('#audio').textContent=d.audio_state==='running'?'声音已就绪':'点击预览中的启用声音';$('#scenario').disabled=d.scenario;const body=frame.contentDocument?.querySelector('#avatar')?.contentDocument?.querySelector('#live2d-frame')?.contentDocument?.body;$('#fps').textContent=body?.dataset.fps?body.dataset.fps+' FPS':'';const version=JSON.stringify(d.events);if(version!==eventVersion){eventVersion=version;$('#events').replaceChildren(...d.events.slice(-30).map(e=>{const row=document.createElement('div');row.className='event';const t=document.createElement('time');t.textContent=e.time;const b=document.createElement('b');b.textContent=e.kind;const s=document.createElement('span');s.textContent=e.detail;row.append(t,b,s);return row}));$('#events').scrollTop=$('#events').scrollHeight}const r=d.recording;$('#record').disabled=['starting','recording','saving'].includes(r.state);$('#record').textContent=r.state==='recording'?`录制中 · ${r.remaining}s`:r.state==='starting'?'准备录像…':r.state==='saving'?'正在导出…':'录制 30 秒动作';if(r.state==='done'){$('#record-result').hidden=false;$('#record-result').href=r.url;$('#record-result').textContent='下载这次动作录像 ↗'}if(r.state==='error')$('#notice').textContent='录像失败：'+r.message;}catch(e){$('#status').textContent='模拟器连接断开'}setTimeout(poll,500)}poll();
</script></body></html>
