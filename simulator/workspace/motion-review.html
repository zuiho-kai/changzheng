<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小征 · 待机动作对照</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4efe7;color:#65564a;font-family:"Microsoft YaHei UI",sans-serif;padding:32px}main{max-width:1600px;margin:auto}h1{font-size:26px;font-weight:500;margin:0 0 12px}p{color:#978675;line-height:1.7}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}figure{margin:0;min-width:0}figcaption{margin-bottom:12px;font-size:18px}video{width:100%;border-radius:10px;background:#e9dccb;display:block}button,a{background:#fffaf3;border:1px solid #cdbda9;padding:10px 18px;border-radius:7px;color:inherit;font:inherit;text-decoration:none;cursor:pointer}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}@media(max-width:760px){body{padding:20px}.pair{grid-template-columns:1fr;gap:28px}}
</style><main><h1>小征的待机，重新动起来。</h1><p>同样的直播画面，直接对照动作幅度和节奏。两段都是实际页面实录，无声。</p><section class="pair"><figure><figcaption>之前 · 轻微连续晃动</figcaption><video src="/static/assets/motion-demo/before.webm" autoplay muted loop playsinline controls></video></figure><figure><figcaption>现在 · 侧倾、探头、停顿与回弹</figcaption><video src="/static/assets/motion-demo/after.webm" autoplay muted loop playsinline controls></video></figure></section><div class="actions"><button id="replay">一起重播</button><button id="pause">暂停 / 继续</button><a href="/stage">打开当前直播画面</a></div></main><script>const videos=[...document.querySelectorAll('video')];document.querySelector('#replay').onclick=()=>videos.forEach(v=>{v.currentTime=0;v.play()});document.querySelector('#pause').onclick=()=>{const pause=videos.some(v=>!v.paused);videos.forEach(v=>pause?v.pause():v.play())};</script></html>
