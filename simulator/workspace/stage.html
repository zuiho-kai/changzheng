<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小征 · 开麦中</title>
  <link rel="stylesheet" href="/static/stage.css">
</head>
<body>
  <main class="room">
    <div class="backdrop" aria-hidden="true"><div class="sun"></div><div class="orbit"></div><span>✦</span></div>
    <header class="masthead"><div class="brand"><span class="brand-star">✦</span><h1>小征</h1><span class="brand-divider"></span><span class="program">随便聊，别客气。</span></div><span class="on-air"><i></i> LIVE</span></header>
    <div class="room-topic"><span class="topic-kicker">JUST CHATTING</span><span>杂谈时间</span></div>
    <iframe id="avatar" src="/overlay" title="小征" allow="autoplay"></iframe>
    <section class="paper" aria-label="观众弹幕"><div class="chat-heading"><span class="chat-dot"></span><span>弹幕区</span><span class="chat-symbol">↗</span></div><div class="note">路过也可以留句话。</div></section>
    <section class="speech" aria-label="小征的回应"><div class="speaker-name"><span>小征</span><i class="speaker-mark">✦</i></div><div class="reply-context" id="reply-context" hidden></div><div class="caption" id="caption"></div></section>
    <footer class="footer"><span>长征酱 <b>／</b> AI 虚拟主播</span><span class="label">正在连接</span></footer>
    <div class="corner-mark" aria-hidden="true">✦</div>
  </main>
  <script src="/static/stage.js"></script>
</body>
</html>
