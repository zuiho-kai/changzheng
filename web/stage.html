<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小征 · 直播画面</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#eeeade;color:#52604d;font-family:"Microsoft YaHei UI",sans-serif}.room{width:100%;height:100%;position:relative;background:radial-gradient(ellipse at 75% 25%,#fff9e9 0,transparent 48%),linear-gradient(125deg,#e8ebdf,#f4ead8)}header{position:absolute;left:6%;top:7%;z-index:2}header small{font-size:clamp(11px,1.1vw,22px);letter-spacing:.22em;color:#87927c}h1{font-size:clamp(24px,3.3vw,64px);font-weight:500;letter-spacing:.1em;margin:.35em 0}.greeting{position:absolute;right:6%;top:8%;font-size:clamp(13px,1.3vw,25px);padding:.7em 1.3em;border:1px solid #bcc5ab;border-radius:100px;color:#859373}.sun{position:absolute;width:40vw;height:40vw;max-height:74vh;max-width:74vh;border-radius:50%;background:#fcf8eaaa;left:50%;top:50%;transform:translate(-50%,-45%);box-shadow:0 0 0 2vw #ffffff19,0 0 0 5vw #ffffff12}.floor{position:absolute;left:-10%;right:-10%;bottom:-25%;height:40%;border-radius:50%;background:#dce2cf}.plant{position:absolute;width:13vw;height:24vh;bottom:4%;opacity:.3;border-left:3px solid #8c9a75;transform:rotate(-25deg)}.plant:before,.plant:after{content:"";position:absolute;width:65%;height:30%;background:#91a37e;border-radius:0 100% 0 100%;top:10%;left:0;transform:rotate(8deg)}.plant:after{top:47%;transform:rotate(165deg);left:-64%}.plant.left{left:12%}.plant.right{right:6%;transform:scaleX(-1) rotate(-30deg)}iframe{position:absolute;width:64%;height:82%;border:0;left:18%;bottom:0;background:transparent}footer{position:absolute;bottom:5%;left:6%;font-size:clamp(12px,1.2vw,23px);letter-spacing:.15em;color:#91a082}.star{position:absolute;color:#b6bc9f;font-size:3vw;right:23%;top:40%;animation:float 8s ease-in-out infinite}@keyframes float{50%{transform:translateY(-12px) rotate(10deg)}}@media(prefers-reduced-motion:reduce){.star{animation:none}}
</style></head><body><main class="room"><div class="sun"></div><div class="floor"></div><div class="plant left"></div><div class="plant right"></div><header><small>A LITTLE COMPANY</small><h1>小征的房间</h1></header><div class="greeting">来聊聊今天</div><span class="star">✦</span><iframe src="/overlay" title="小征和已说出的字幕" allow="autoplay"></iframe><footer>说到哪，聊到哪。</footer></main></body></html>
